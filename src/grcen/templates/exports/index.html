{% extends "base.html" %}
{% block title %}Export - GRCen{% endblock %}
{% block content %}
<h1>Export Assets</h1>

<div class="card">
    <form id="export-form" method="get" action="/api/exports/assets">
        <div class="form-group">
            <label for="export-format">Format</label>
            <select name="format" id="export-format">
                <option value="csv">CSV</option>
                <option value="json">JSON</option>
            </select>
        </div>

        <div class="form-group">
            <label for="export-types">Asset Types (comma-separated, or leave blank for all)</label>
            <input type="text" name="types" id="export-types" placeholder="e.g. person,system,risk">
            <small>Available: {% for t in asset_types %}{{ t.value }}{% if not loop.last %}, {% endif %}{% endfor %}</small>
        </div>

        <div class="form-group">
            <label for="export-status">Status Filter</label>
            <select name="status" id="export-status">
                <option value="">All</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="draft">Draft</option>
                <option value="archived">Archived</option>
            </select>
        </div>

        <div class="form-group">
            <label for="export-columns">Columns (comma-separated, or leave blank for all)</label>
            <input type="text" name="columns" id="export-columns" placeholder="e.g. id,name,type,status">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Download Export</button>
        </div>
    </form>
</div>
{% endblock %}
